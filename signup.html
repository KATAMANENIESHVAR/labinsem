<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Student Registration</h2>
    <form onsubmit="signup(event)">
        <input type="text" id="name" placeholder="Full Name" required><br><br>
        <input type="text" id="studentId" placeholder="Student ID" required><br><br>
        <input type="text" id="newUsername" placeholder="Create Username" required><br><br>
        <input type="password" id="newPassword" placeholder="Create Password" required><br><br>
        <button type="submit">Sign Up</button>
    </form>
    <p id="message"></p>
    <a href="index.html">Back to Login</a>
    <script src="script.js"></script>
</body>
</html>
